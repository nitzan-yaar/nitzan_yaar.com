<!DOCTYPE html>
<html lang="he" dir="rtl">
<head
    <link rel="apple-touch-icon" href="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTgwIiBoZWlnaHQ9IjE4MCIgdmlld0JveD0iMCAwIDE4MCAxODAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxyZWN0IHdpZHRoPSIxODAiIGhlaWdodD0iMTgwIiByeD0iNTAiIGZpbGw9IiM4RTQ0QUQiLz4KPHBhdGggZD0iTTU1IDkwSDkwTTEwNSAxMTBMOTAgOTBMODAgMTQwTTExMCA5MEgxMjVNOTAgOTBIOEM4MC4zNDMzIDkwIDgxIDEwMS4zNDMgODEgMTE1TDEwNSAxMTUiIHN0cm9rZT0id2hpdGUiIHN0cm9rZS13aWR0aD0iMTIiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCIvPgo8L3N2Zz4K">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>קופת החיסכון שלי</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Assistant', sans-serif;
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8">

    <div class="max-w-md mx-auto space-y-6">
        
        <!-- כרטיס יתרה -->
        <div class="bg-gradient-to-br from-blue-600 to-indigo-700 rounded-3xl p-8 text-white shadow-xl relative overflow-hidden text-center">
            <div class="relative z-10">
                <h1 class="text-xl opacity-90 mb-2 flex justify-center items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.3-11 5 0 1.8 0 3 2 4.5V20h4v-2h3v2h4v-4c1-.5 1.7-1 2-2h2v-4h-2c0-1-.5-1.5-1-2h0V5z"/><path d="M7 11h.01"/><path d="M11 11h.01"/><path d="M15 11h.01"/></svg>
                    הקופה שלי
                </h1>
                <div id="balance-display" class="text-5xl font-bold tracking-tight">
                    ₪186.70
                </div>
            </div>
            <div class="absolute -bottom-10 -left-10 w-40 h-40 bg-white opacity-10 rounded-full"></div>
        </div>

        <!-- גרף קו - מגמת יתרה -->
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
            <h2 class="text-lg font-bold mb-4 text-slate-800 text-center">מגמת החיסכון</h2>
            <div class="h-48">
                <canvas id="balanceChart"></canvas>
            </div>
        </div>

        <!-- טופס עדכון -->
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
            <h2 class="text-lg font-bold mb-4 text-slate-800">עדכון יתרה</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-slate-500 mb-1">סכום בשקלים</label>
                    <input id="amount-input" type="number" step="0.1" placeholder="0.00" class="w-full text-2xl font-semibold p-3 border-b-2 border-slate-200 focus:border-blue-500 outline-none transition-colors text-left" dir="ltr" />
                </div>
                <div>
                    <label class="block text-sm text-slate-500 mb-1">הערה (אופציונלי)</label>
                    <input id="note-input" type="text" placeholder="למשל: דמי כיס, קניתי משהו..." class="w-full p-2 bg-slate-50 rounded-lg border border-slate-100 outline-none focus:ring-1 ring-blue-200" />
                </div>
                <div class="flex gap-3">
                    <button onclick="updateBalance('deposit')" class="flex-1 bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 transition-all active:scale-95 shadow-md shadow-green-100">
                        הוספה
                    </button>
                    <button onclick="updateBalance('withdrawal')" class="flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 transition-all active:scale-95 shadow-md shadow-red-100">
                        הורדה
                    </button>
                </div>
            </div>
        </div>

        <!-- היסטוריה -->
        <div class="space-y-3">
            <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2 px-1">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-blue-500"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                פעולות אחרונות
            </h2>
            <div id="transactions-list" class="space-y-2 pb-6"></div>
            
            <button onclick="confirmReset()" class="w-full text-xs text-slate-400 hover:text-red-400 transition-colors py-4">
                איפוס נתונים והתחלה מחדש (186.7 ש"ח)
            </button>
        </div>
    </div>

    <!-- מודאל שגיאה -->
    <div id="error-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-2xl max-w-xs w-full text-center space-y-4 shadow-2xl">
            <div class="text-red-500 flex justify-center">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            </div>
            <p id="error-message" class="text-slate-600 font-bold">אין מספיק כסף בקופה.</p>
            <button onclick="closeModal()" class="w-full bg-slate-800 text-white py-2 rounded-lg font-bold">הבנתי</button>
        </div>
    </div>

    <script>
        const STORAGE_KEY_BALANCE = 'piggy_bank_balance';
        const STORAGE_KEY_TRANSACTIONS = 'piggy_bank_transactions';

        let balance = parseFloat(localStorage.getItem(STORAGE_KEY_BALANCE)) || 186.7;
        let transactions = JSON.parse(localStorage.getItem(STORAGE_KEY_TRANSACTIONS)) || [
            { id: 1, amount: 186.7, type: 'deposit', note: 'יתרה ראשונית', date: new Date().toLocaleString('he-IL') }
        ];

        let myChart;

        function initChart() {
            const ctx = document.getElementById('balanceChart').getContext('2d');
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: calculateHistoryLabels(),
                    datasets: [{
                        label: 'יתרה בשקלים',
                        data: calculateHistoryPoints(),
                        borderColor: '#2563eb',
                        backgroundColor: 'rgba(37, 99, 235, 0.1)',
                        fill: true,
                        tension: 0.3,
                        pointRadius: 4,
                        pointBackgroundColor: '#2563eb'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: { 
                            beginAtZero: false,
                            grid: { color: '#f1f5f9' }
                        },
                        x: { 
                            display: false // מחביאים את התאריכים הצפופים בציר ה-X
                        }
                    }
                }
            });
        }

        // חישוב נקודות היתרה לאורך זמן
        function calculateHistoryPoints() {
            let current = 0;
            // הופכים את המערך כדי לחשב מההתחלה לסוף
            const sorted = [...transactions].reverse();
            const points = [];
            
            sorted.forEach(t => {
                if (t.type === 'deposit') current += t.amount;
                else current -= t.amount;
                points.push(current);
            });
            
            return points;
        }

        function calculateHistoryLabels() {
            return [...transactions].reverse().map(t => t.date);
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY_BALANCE, balance.toString());
            localStorage.setItem(STORAGE_KEY_TRANSACTIONS, JSON.stringify(transactions));
        }

        function render() {
            document.getElementById('balance-display').innerText = `₪${balance.toLocaleString('he-IL', { minimumFractionDigits: 2 })}`;

            // עדכון הגרף
            if (myChart) {
                myChart.data.labels = calculateHistoryLabels();
                myChart.data.datasets[0].data = calculateHistoryPoints();
                myChart.update();
            }

            const list = document.getElementById('transactions-list');
            list.innerHTML = '';

            transactions.forEach(t => {
                const item = document.createElement('div');
                item.className = 'bg-white p-4 rounded-xl shadow-sm border border-slate-50 flex items-center justify-between transition-all hover:bg-slate-50';
                const isDeposit = t.type === 'deposit';
                
                item.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="p-2 rounded-full ${isDeposit ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'}">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="${isDeposit?12:8}" y1="12" x2="16" y2="12"/>${isDeposit?'<line x1="12" y1="8" x2="12" y2="16"/>':''}</svg>
                        </div>
                        <div>
                            <div class="font-bold text-slate-800">${t.note}</div>
                            <div class="text-xs text-slate-400">${t.date}</div>
                        </div>
                    </div>
                    <div class="text-lg font-bold ${isDeposit ? 'text-green-600' : 'text-red-600'}">
                        ${isDeposit ? '+' : '-'} ₪${t.amount.toLocaleString()}
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function updateBalance(type) {
            const amountInput = document.getElementById('amount-input');
            const noteInput = document.getElementById('note-input');
            const amount = parseFloat(amountInput.value);
            const note = noteInput.value.trim();

            if (isNaN(amount) || amount <= 0) return;
            if (type === 'withdrawal' && amount > balance) {
                showModal('אין מספיק כסף בקופה!');
                return;
            }

            if (type === 'deposit') balance += amount;
            else balance -= amount;

            transactions.unshift({
                id: Date.now(),
                amount,
                type,
                note: note || (type === 'deposit' ? 'הפקדה' : 'משיכה'),
                date: new Date().toLocaleString('he-IL', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'})
            });

            amountInput.value = '';
            noteInput.value = '';
            saveData();
            render();
        }

        function confirmReset() {
            if (confirm('לאפס את כל הנתונים ולחזור ליתרה המקורית?')) {
                balance = 186.7;
                transactions = [
                    { id: 1, amount: 186.7, type: 'deposit', note: 'יתרה ראשונית', date: new Date().toLocaleString('he-IL', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}) }
                ];
                saveData();
                render();
            }
        }

        function showModal(msg) {
            document.getElementById('error-message').innerText = msg;
            document.getElementById('error-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('error-modal').classList.add('hidden');
        }

        window.onload = () => {
            initChart();
            render();
        };
    </script>
</body>
</html>
